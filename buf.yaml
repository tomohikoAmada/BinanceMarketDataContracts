version: v2
modules:
  - path: src/binance_market_data_contracts/proto
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - PACKAGE_VERSION_SUFFIX
  enum_zero_value_suffix: _UNSPECIFIED
  rpc_allow_google_protobuf_empty_requests: true
  rpc_allow_google_protobuf_empty_responses: true
breaking:
  use:
    - FILE
  # MarketRuntimeStatus.connection_generation is a DRAFT field whose explicit
  # presence semantics are intentionally corrected while retaining field 6.
  ignore_only:
    FIELD_SAME_CARDINALITY:
      - src/binance_market_data_contracts/proto/binance_market_data/gateway/v1/gateway_messages.proto
