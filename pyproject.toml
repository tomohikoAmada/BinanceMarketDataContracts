[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-market-data-contracts"
version = "0.1.0a1"
description = "Versioned public contracts, schemas, fixtures and architecture decisions for BinanceMarketData"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BinanceMarketData Team" }]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
schema-export = "binance_market_data_contracts.schema_export:main"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
show_error_codes = true
exclude = ["build", "dist", ".venv", "venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
