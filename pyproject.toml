[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-market-data-contracts"
version = "0.2.0a1"
description = "Versioned public contracts, Protobuf wire contracts, schemas, fixtures and architecture decisions for BinanceMarketData"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "BinanceMarketData Team" }]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.10,<3",
    "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
wire = [
    "grpcio>=1.81.1,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "build>=1,<2",
    "twine>=5,<7",
    "jsonschema>=4.23,<5",
    "protobuf==6.33.5",
    "grpcio==1.81.1",
    "grpcio-tools==1.81.1",
]

[project.scripts]
schema-export = "binance_market_data_contracts.schema_export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binance_market_data_contracts = [
    "py.typed",
    "proto/**/*.proto",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv", "venv", "src/binance_market_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["TC001", "SIM102", "B007", "B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
show_error_codes = true
exclude = ["build", "dist", ".venv", "venv", "src/binance_market_data"]

[[tool.mypy.overrides]]
module = [
    "binance_market_data.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "binance_market_data_contracts.wire.adapters",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
