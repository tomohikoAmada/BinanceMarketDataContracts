name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src/binance_market_data_contracts
      - name: pytest
        run: pytest -q
      - name: Schema export
        run: python -m binance_market_data_contracts.schema_export --output schemas/json
      - name: Schema drift check
        run: git diff --exit-code -- schemas/json
      - name: Proto codegen check
        run: python -m binance_market_data_contracts.proto_codegen --check
      - name: Build package
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Wheel contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "binance_market_data_contracts/py.typed" in names
          assert "binance_market_data/py.typed" in names
          proto_files = sorted(n for n in names if n.endswith(".proto"))
          pb2_files = sorted(n for n in names if n.endswith("_pb2.py"))
          pyi_files = sorted(n for n in names if n.startswith("binance_market_data/") and n.endswith(".pyi"))
          assert len(proto_files) == 8, proto_files
          assert len(pb2_files) == 8, pb2_files
          assert len(pyi_files) == 8, pyi_files
          assert "binance_market_data/gateway/v1/gateway_service_pb2_grpc.py" in names
          print(f"wheel contents: {len(proto_files)} proto, {len(pb2_files)} pb2, {len(pyi_files)} pyi")
          PY

      - name: Base wheel isolation
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf "$TEST_ROOT"' EXIT
          cp -R schemas/json "$TEST_ROOT/repository-schemas"
          cp fixtures/valid/depth-update.v1.spot.json "$TEST_ROOT/depth-update.v1.spot.json"
          python -m venv "$TEST_ROOT/venv"
          "$TEST_ROOT/venv/bin/python" -m pip install "$WHEEL"
          cd "$TEST_ROOT"
          "$TEST_ROOT/venv/bin/python" - <<'PY'
          import sys
          from importlib.resources import files
          from pathlib import Path
          from binance_market_data_contracts import DepthUpdate

          assert "grpc" not in sys.modules
          assert "binance_market_data.gateway.v1.gateway_service_pb2_grpc" not in sys.modules
          assert files("binance_market_data").joinpath("py.typed").is_file()
          payload = Path("depth-update.v1.spot.json").read_text(encoding="utf-8")
          event = DepthUpdate.model_validate_json(payload)
          assert event.metadata.stream.value == "DIFF_DEPTH"
          assert event.metadata.schema_version == "depth-update.v1"
          assert event.first_update_id <= event.final_update_id
          assert not hasattr(event.bids, "append")
          assert "grpc" not in sys.modules
          assert "binance_market_data.gateway.v1.gateway_service_pb2_grpc" not in sys.modules
          print("installed wheel parsed real fixture")
          PY
          "$TEST_ROOT/venv/bin/schema-export" --output "$TEST_ROOT/exported-schemas"
          diff -ru "$TEST_ROOT/repository-schemas" "$TEST_ROOT/exported-schemas"

      - name: Wire wheel isolation
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf "$TEST_ROOT"' EXIT
          cp fixtures/valid/depth-update.v1.spot.json "$TEST_ROOT/depth-update.v1.spot.json"
          python -m venv "$TEST_ROOT/venv"
          "$TEST_ROOT/venv/bin/python" -m pip install "${WHEEL}[wire]"
          cd "$TEST_ROOT"
          "$TEST_ROOT/venv/bin/python" - <<'PY'
          import sys
          from importlib.resources import files
          from pathlib import Path

          before = tuple(sys.path)
          import binance_market_data_contracts.wire
          from binance_market_data.common.v1 import enums_pb2
          from binance_market_data.gateway.v1 import gateway_service_pb2, gateway_service_pb2_grpc
          from binance_market_data.market.v1 import market_events_pb2
          from binance_market_data_contracts import DepthUpdate
          from binance_market_data_contracts.wire.adapters import depth_update_from_pb, depth_update_to_pb
          after = tuple(sys.path)
          assert after == before
          assert files("binance_market_data").joinpath("py.typed").is_file()
          assert enums_pb2.Venue.VENUE_BINANCE == 1
          assert market_events_pb2.DepthUpdate is not None
          assert gateway_service_pb2_grpc.BinanceMarketDataGatewayServiceStub is not None
          service = gateway_service_pb2.DESCRIPTOR.services_by_name["BinanceMarketDataGatewayService"]
          assert [method.name for method in service.methods] == [
              "SubscribeEvents", "SubscribeOrderBook", "SubscribeMarketState", "GetGatewayStatus"
          ]
          event = DepthUpdate.model_validate_json(Path("depth-update.v1.spot.json").read_text(encoding="utf-8"))
          encoded = depth_update_to_pb(event).SerializeToString()
          decoded = market_events_pb2.DepthUpdate()
          decoded.ParseFromString(encoded)
          assert depth_update_from_pb(decoded) == event
          PY

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.60.0"
      - name: Buf format
        run: buf format --diff --exit-code
      - name: Buf lint
        run: buf lint
      - name: Buf build
        run: buf build
      - name: Buf breaking integration
        run: python tests/buf_breaking_integration.py
      - name: Buf breaking (PR only)
        if: github.event_name == 'pull_request'
        run: bash scripts/check_buf_breaking.sh origin/main

  cpp-static:
    name: C++ static / ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build-type: Release
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build-type: Debug
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build-type: Release
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build-type: Debug
          - os: macos-15
            compiler: appleclang
            cc: clang
            cxx: clang++
            build-type: Release
          - os: macos-15
            compiler: appleclang
            cc: clang
            cxx: clang++
            build-type: Debug
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert macOS ARM64 runner
        if: runner.os == 'macOS'
        run: test "$RUNNER_ARCH" = ARM64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest>=8,<10'
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Create and test candidate package
        run: >-
          conan create . --build=missing --lockfile=conan.lock
          -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20
          -s:h build_type=${{ matrix.build-type }}
          -o:h '&:shared=False'

  cpp-consumers:
    name: C++ package consumers and isolation
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest>=8,<10'
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install locked dependencies
        run: >-
          conan install . --output-folder=build/conan --build=missing --lockfile=conan.lock
          -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20
      - name: Configure and build package
        run: >-
          conan build . --output-folder=build/conan
          -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20
      - name: Verify build/install/relocation consumers
        run: >-
          python tools/verify_cpp_consumers.py
          --source-root "$PWD"
          --build-dir "$PWD/build/conan/build/Release"
          --dependency-prefix "$PWD/build/conan/build/Release/generators"

  cpp-shared:
    name: C++ shared Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Assert macOS ARM64 runner
        if: runner.os == 'macOS'
        run: test "$RUNNER_ARCH" = ARM64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest>=8,<10'
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Create and test shared candidate package
        run: >-
          conan create . --build=missing --lockfile=conan.lock
          -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20
          -o:h '&:shared=True'

  conan-reproducibility:
    name: Conan clean-cache lock and offline replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest>=8,<10'
      - name: Use clean Conan cache
        run: |
          echo "CONAN_HOME=${RUNNER_TEMP}/c-m4-001-conan" >> "$GITHUB_ENV"
          export CONAN_HOME="${RUNNER_TEMP}/c-m4-001-conan"
          conan profile detect --force
      - name: Check lock drift
        run: |
          conan lock create . -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20 --lockfile-out="${RUNNER_TEMP}/candidate.lock"
          python scripts/check_conan_lock.py conan.lock "${RUNNER_TEMP}/candidate.lock"
      - name: Populate clean cache and create package
        run: >-
          conan create . --build=missing --lockfile=conan.lock
          -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20
      - name: Offline source-build replay
        run: |
          conan remove 'binance-market-data-contracts-cpp/*' -c
          conan remote disable conancenter
          conan create . --build=missing --lockfile=conan.lock -pr:h=profiles/conan/cpp20 -pr:b=profiles/conan/cpp20

  cpp-macos-reproducibility:
    name: C++ macOS ARM64 deterministic static package
    runs-on: macos-15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Assert macOS ARM64 runner
        run: test "$RUNNER_ARCH" = ARM64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build tools
        run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest>=8,<10'
      - name: Build identical static package twice and generate provenance
        run: >-
          python -m tools.verify_conan_reproducibility
          --source-root "$PWD"
          --conan-home "$RUNNER_TEMP/c-m4-001-double-build"
          --profile-host "$PWD/profiles/conan/cpp20"
          --profile-build "$PWD/profiles/conan/cpp20"
          --output "$RUNNER_TEMP/c-m4-001-artifact-provenance.json"
      - name: Retain concrete binary provenance
        uses: actions/upload-artifact@v4
        with:
          name: c-m4-001-macos-arm64-static-provenance
          path: ${{ runner.temp }}/c-m4-001-artifact-provenance.json
          if-no-files-found: error
