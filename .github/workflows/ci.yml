name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy $(find src/binance_market_data_contracts -name '*.py' -not -path '*/__pycache__/*' -not -path '*/proto/*' -not -name 'proto_codegen.py' -not -name 'schema_export.py')
      - name: pytest
        run: pytest -q
      - name: Schema export
        run: python -m binance_market_data_contracts.schema_export --output schemas/json
      - name: Schema drift check
        run: git diff --exit-code -- schemas/json
      - name: Proto codegen check
        run: python -m binance_market_data_contracts.proto_codegen --check
      - name: Build package
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Wheel isolation test
        shell: bash
        run: |
          set -euo pipefail

          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "binance_market_data_contracts/py.typed" in names, "py.typed is missing from wheel"
          ProtoFiles = sorted(n for n in names if n.endswith('.proto'))
          assert len(ProtoFiles) >= 8, f"Expected >=8 .proto files in wheel, got {len(ProtoFiles)}"
          print(f"py.typed present, {len(ProtoFiles)} .proto files in wheel")
          PY

          rm -rf /tmp/contracts-wheel-test
          rm -rf /tmp/exported-schemas
          rm -rf /tmp/repository-schemas
          rm -f /tmp/depth-update.v1.spot.json

          cp -R schemas/json /tmp/repository-schemas
          cp fixtures/valid/depth-update.v1.spot.json /tmp/depth-update.v1.spot.json

          python -m venv /tmp/contracts-wheel-test
          /tmp/contracts-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/contracts-wheel-test/bin/python -m pip install "$WHEEL"

          cd /tmp

          /tmp/contracts-wheel-test/bin/python - <<'PY'
          from pathlib import Path
          from binance_market_data_contracts import DepthUpdate

          payload = Path("/tmp/depth-update.v1.spot.json").read_text(encoding="utf-8")
          event = DepthUpdate.model_validate_json(payload)
          assert event.metadata.stream.value == "DIFF_DEPTH"
          assert event.metadata.schema_version == "depth-update.v1"
          assert event.first_update_id <= event.final_update_id
          assert not hasattr(event.bids, "append")
          print("installed wheel parsed real fixture")
          PY

          /tmp/contracts-wheel-test/bin/schema-export --output /tmp/exported-schemas

          diff -ru /tmp/repository-schemas /tmp/exported-schemas
          echo "wheel schema diff passed"

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.60.0"
      - name: Buf format
        run: buf format --diff --exit-code
      - name: Buf lint
        run: buf lint
      - name: Buf build
        run: buf build
      - name: Buf breaking (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "origin/main ref not available, skipping breaking check"
            exit 0
          fi
          if ! git ls-tree --name-only origin/main -- '*.proto' | grep -q '.'; then
            echo "Initial Protobuf baseline: no breaking comparison is possible"
            exit 0
          fi
          buf breaking --against '.git#branch=origin/main'
